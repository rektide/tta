[workspace]
members = ["shell/command", "session/launcher", "app/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rektide/tta"

[workspace.dependencies]
anyhow = "1"
bon = "3.10"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
thiserror = "2"
tmax = { path = "../tmux-interface-control", default-features = false, features = ["client"] }
tta-command = { path = "shell/command" }
tta-launcher = { path = "session/launcher", default-features = false }
