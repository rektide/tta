[workspace]
members = ["shell/command", "scaffold/rekon", "scaffold/rekon-native", "session/launcher", "session/runner", "app/cli", "verification/driver", "verification/core"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rektide/tta"

[workspace.dependencies]
anyhow = "1"
bon = "3.10"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tmax = { path = "../tmux-interface-control", version = "=0.6.0", default-features = false, features = ["operations"] }
tta-command = { path = "shell/command" }
tta-launcher = { path = "session/launcher", default-features = false }
tta-runner = { path = "session/runner", default-features = false }
tta-scaffold-rekon = { path = "scaffold/rekon" }
tta-scaffold-rekon-native = { path = "scaffold/rekon-native" }
