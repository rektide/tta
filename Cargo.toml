[workspace]
members = ["shell/command", "scaffold/rekon", "session/launcher", "app/cli", "verification/driver"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rektide/tta"

[workspace.dependencies]
anyhow = "1"
bon = "3.10"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tmax = { path = "../tmux-interface-control", default-features = false, features = ["client"] }
tta-command = { path = "shell/command" }
tta-launcher = { path = "session/launcher", default-features = false }
tta-scaffold-rekon = { path = "scaffold/rekon" }
