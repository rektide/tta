[package]
name = "tta"
description = "Attach to a matching tmux session, or start one in a matching project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["native", "scaffold-rekon", "scaffold-rekon-native", "scaffold-by-default"]
native = ["tta-launcher/native"]
cli = ["tta-launcher/cli"]
scaffold-rekon = ["tta-launcher/scaffold-rekon"]
scaffold-rekon-native = ["tta-launcher/scaffold-rekon-native"]
scaffold-by-default = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
tmax.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tta-command.workspace = true
tta-launcher.workspace = true

[dev-dependencies]
tempfile.workspace = true
tta-verify = { path = "../../verification/driver" }
