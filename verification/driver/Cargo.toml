[package]
name = "tta-verify"
description = "Instrumented private-tmux runtime acceptance driver for tta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "tta-verify"

[dependencies]
anyhow.workspace = true
bon.workspace = true
clap.workspace = true
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile.workspace = true
tta-command.workspace = true
tta-runner.workspace = true
tta-launcher = { workspace = true, features = ["scaffold-rekon-native", "scaffold-rekon"] }
