# Independent review witness: NOT a workspace member and NOT part of the
# shipped verification toolkit yet. It depends only on the pure core
# (tta-launcher + tta-command) and std — never tta-runner — and proves the
# public runner-free request -> probe -> decode -> resume loop with a
# stdlib-only process carrier. Ownership/promotion is deliberately undecided.
[package]
name = "ssh-review-runner-free"
description = "Review witness: runner-free probe round-trip through the public core API"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"
tta-command = { path = "../../../../shell/command" }
tta-launcher = { path = "../../../../session/launcher", features = ["scaffold-rekon-native"] }
