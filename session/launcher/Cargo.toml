[package]
name = "tta-launcher"
description = "Resolve tmux sessions and project directories into executable launch plans"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = []
cli = []
scaffold-rekon = ["dep:tta-scaffold-rekon"]

[dependencies]
anyhow.workspace = true
bon.workspace = true
rustix.workspace = true
serde.workspace = true
thiserror.workspace = true
tmax.workspace = true
toml.workspace = true
tracing.workspace = true
tta-command.workspace = true
tta-scaffold-rekon = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tracing-mock = "=0.1.0-beta.3"
tracing-test = { version = "=0.2.6", features = ["no-env-filter"] }
