[package]
name = "tta-launcher"
description = "Pure observation-driven tmux session and project launch planning"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
scaffold-rekon = ["dep:tta-scaffold-rekon"]
scaffold-rekon-native = ["dep:tta-scaffold-rekon-native"]

[dependencies]
anyhow.workspace = true
bon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tmax.workspace = true
toml.workspace = true
tracing.workspace = true
xmachines-runtime.workspace = true
tta-command.workspace = true
tta-scaffold-rekon = { workspace = true, optional = true }
tta-scaffold-rekon-native = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tracing-mock = "=0.1.0-beta.3"
tracing-test = { version = "=0.2.6", features = ["no-env-filter"] }
